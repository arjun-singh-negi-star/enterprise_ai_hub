# =====================================================================
# 🐳 Enterprise AI Email Orchestrator — Docker Compose
# Services: FastAPI Backend + Streamlit Frontend + Redis + Celery
# =====================================================================
version: '3.8'

services:

  # ──────────────────────────────────────────
  # 🔴 REDIS (Message Broker for Celery)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # ⚡ FASTAPI BACKEND
  # ──────────────────────────────────────────
  backend:
    build: .
    container_name: enterprise_backend
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app                          # Live reload during dev
      - ./knowledge_base:/app/knowledge_base
      - ./soc2_audit_trail.json:/app/soc2_audit_trail.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────
  # 🎨 STREAMLIT FRONTEND
  # ──────────────────────────────────────────
  frontend:
    build: .
    container_name: enterprise_frontend
    command: python -m streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ──────────────────────────────────────────
  # 🌿 CELERY WORKER (Background SLA Tasks)
  # ──────────────────────────────────────────
  celery_worker:
    build: .
    container_name: enterprise_celery
    command: python -m celery -A backend.tasks worker --loglevel=info --pool=solo
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ──────────────────────────────────────────
  # ⏰ CELERY BEAT (SLA Timer Scheduler)
  # ──────────────────────────────────────────
  celery_beat:
    build: .
    container_name: enterprise_celery_beat
    command: python -m celery -A backend.tasks beat --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: enterprise_ai_network